<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neuronviz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15110e; --panel:#1c1713; --line:#3a322b; --text:#efe6da; --muted:#a09484;
  --blue:#5578c8; --orange:#e8903a;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.word{font-weight:500;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:var(--orange);animation:pulse 1.2s ease-in-out infinite}
.status.done i{background:var(--blue)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.live i{animation:none}}
main{max-width:1180px;margin:0 auto;padding:0 28px 48px}
h1{font:italic 400 clamp(40px,6vw,68px)/1.05 var(--serif);margin:12px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--muted)}
.views{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.views{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{display:block;width:100%;aspect-ratio:1}
#net{display:block;width:100%;height:100%;min-height:340px}
.under{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0}
@media (max-width:860px){.under{grid-template-columns:minmax(0,1fr)}}
.reads{display:flex;flex-direction:column;gap:14px;padding:20px 28px 20px 22px;border-right:1px solid var(--line);min-width:190px}
@media (max-width:860px){.reads{flex-direction:row;gap:28px;border-right:0;border-bottom:1px solid var(--line)}}
.reads span{display:block;color:var(--muted);font-size:13px}
.reads b{font:400 34px/1.05 var(--serif)}
#r-loss{color:var(--orange)} #r-acc{color:#8fa8e6}
#loss{display:block;width:100%;height:190px}
.ctl{display:flex;align-items:center;gap:14px;margin-top:16px}
button{font:500 14px var(--sans);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--orange)}
.empty{max-width:560px;margin:12vh auto 0;text-align:left}
.empty h1{margin-top:0}
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<header>
  <span class="word">neuronviz</span>
  <span id="status" class="status"><i></i><b style="font-weight:400">Waiting for a run</b></span>
</header>

<main id="empty" class="empty">
  <h1>Waiting for a run.</h1>
  <p class="sub">Add one line after you build your model and data, then run your script as usual.</p>
<pre>import neuronviz as nv
nv.attach(model, X, y)</pre>
</main>

<main id="live" hidden>
  <h1 id="arch"></h1>
  <p class="sub" id="sub"></p>
  <section class="views">
    <div class="panel"><canvas id="map"></canvas></div>
    <div class="panel"><canvas id="net"></canvas></div>
  </section>
  <section class="panel under">
    <div class="reads">
      <div><span>Step</span><b id="r-step">0</b></div>
      <div><span>Loss</span><b id="r-loss">-</b></div>
      <div id="acc-box"><span>Accuracy</span><b id="r-acc">-</b></div>
    </div>
    <canvas id="loss"></canvas>
  </section>
  <div class="ctl">
    <button id="play" type="button">Replay</button>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Training step">
  </div>
</main>

<script>
const BLUE=[85,120,200], ORANGE=[232,144,58], BG=[28,23,19];
const PAL=[BLUE,ORANGE,[120,190,140],[200,110,170],[220,200,90],[110,190,210],[170,130,220],[200,120,100]];
const $=id=>document.getElementById(id);
let run=null, meta={}, frames=[], cur=-1, following=true, finished=false, timer=null;

function fit(c){
  const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return [ctx,w,h];
}
function hexToBytes(h){const n=h.length>>1,a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function pointColor(l){
  if(meta.mode==='bin') return l>.5?ORANGE:BLUE;
  if(meta.mode==='multi') return PAL[l%PAL.length];
  const [a,b]=meta.yrange, t=(l-a)/((b-a)||1); return t>.5?ORANGE:BLUE;
}

const off=document.createElement('canvas');
function drawMap(f){
  const [ctx,S]=fit($('map'));
  if(!meta.has_map){
    ctx.fillStyle='#a09484';ctx.font='15px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';
    ctx.fillText('The decision map needs exactly 2 input features.',S/2,S/2);return;
  }
  const G=meta.grid, mode=meta.mode;
  if(!f.b) f.b=hexToBytes(f.grid);
  const b=f.b; off.width=off.height=G;
  const octx=off.getContext('2d'), img=octx.createImageData(G,G), d=img.data;
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){
    const k=j*G+i; let col,a;
    if(mode==='bin'){const p=b[k]/255; col=p>.5?ORANGE:BLUE; a=.12+.55*Math.abs(p-.5)*2;}
    else if(mode==='multi'){col=PAL[b[2*k]%PAL.length]; a=.12+.55*b[2*k+1]/255;}
    else{const t=b[k]/255; col=t>.5?ORANGE:BLUE; a=.08+.55*Math.abs(t-.5)*2;}
    const o=((G-1-j)*G+i)*4;
    for(let m=0;m<3;m++) d[o+m]=BG[m]*(1-a)+col[m]*a;
    d[o+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,S,S);

  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<16;i++){const v=Math.round(i*S/16)+.5;ctx.moveTo(v,0);ctx.lineTo(v,S);ctx.moveTo(0,v);ctx.lineTo(S,v);}
  ctx.stroke();

  if(mode==='bin'){ // decision boundary by marching squares
    const X=i=>(i+.5)/G*S, Y=j=>S-(j+.5)/G*S, v=(i,j)=>b[j*G+i]-127.5;
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath();
    for(let j=0;j<G-1;j++)for(let i=0;i<G-1;i++){
      const c=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]], pts=[];
      for(let e=0;e<4;e++){
        const [x1,y1]=c[e],[x2,y2]=c[(e+1)%4], v1=v(x1,y1), v2=v(x2,y2);
        if((v1<0)!==(v2<0)){const t=v1/(v1-v2); pts.push([X(x1+(x2-x1)*t),Y(y1+(y2-y1)*t)]);}
      }
      for(let q=0;q+1<pts.length;q+=2){ctx.moveTo(pts[q][0],pts[q][1]);ctx.lineTo(pts[q+1][0],pts[q+1][1]);}
    }
    ctx.stroke();
  }

  const [x0,x1,y0,y1]=meta.bounds;
  for(const [x,y,l] of meta.points){
    ctx.beginPath();ctx.arc((x-x0)/(x1-x0)*S,S-(y-y0)/(y1-y0)*S,3.2,0,6.283);
    ctx.fillStyle=rgba(pointColor(l),.95);ctx.fill();
    ctx.strokeStyle='rgba(21,17,14,.7)';ctx.lineWidth=.8;ctx.stroke();
  }
}

function drawNet(f){
  const [ctx,W,H]=fit($('net')), L=meta.layers, nl=L.length;
  const padX=46, top=44, bot=40, shown=L.map(l=>Math.min(l.n,16));
  const xs=i=>padX+i*(W-2*padX)/(nl-1);
  const ys=(li,k)=>{const n=shown[li],span=H-top-bot;return n===1?top+span/2:top+k*span/(n-1);};
  let mx=1e-6; f.w.forEach(M=>M.forEach(r=>r.forEach(v=>{mx=Math.max(mx,Math.abs(v));})));
  ctx.lineCap='round';
  for(let li=1;li<nl;li++){
    const M=f.w[li-1];
    for(let o=0;o<shown[li];o++)for(let i=0;i<shown[li-1];i++){
      const w=M[o][i], t=Math.min(1,Math.abs(w)/mx);
      ctx.strokeStyle=rgba(w>0?ORANGE:BLUE,.06+.7*t); ctx.lineWidth=.4+1.5*t;
      ctx.beginPath();ctx.moveTo(xs(li-1),ys(li-1,i));ctx.lineTo(xs(li),ys(li,o));ctx.stroke();
    }
  }
  const font=getComputedStyle(document.body).fontFamily;
  ctx.textAlign='center';
  for(let li=0;li<nl;li++){
    for(let k=0;k<shown[li];k++){
      ctx.beginPath();ctx.arc(xs(li),ys(li,k),li===0||li===nl-1?6:4.5,0,6.283);
      ctx.fillStyle='#1c1713';ctx.fill();ctx.strokeStyle='#efe6da';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.fillStyle='#a09484';ctx.font='12px '+font;
    ctx.fillText(L[li].n>16?`${L[li].n} (16 shown)`:String(L[li].n),xs(li),H-14);
    if(L[li].act) ctx.fillText(L[li].act,xs(li),22);
  }
}

function drawLoss(){
  const [ctx,W,H]=fit($('loss')), pad=18;
  const fs=frames.filter(f=>isFinite(f.loss));
  if(fs.length<2) return;
  const maxS=fs[fs.length-1].step||1, maxL=Math.max(...fs.map(f=>f.loss))*1.08||1;
  const X=s=>pad+s/maxS*(W-2*pad), YL=l=>H-pad-l/maxL*(H-2*pad), YA=a=>H-pad-a*(H-2*pad);
  ctx.strokeStyle='#3a322b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,H-pad+.5);ctx.lineTo(W-pad,H-pad+.5);ctx.stroke();
  const line=(fn,col)=>{ctx.beginPath();fs.forEach((f,i)=>{const [x,y]=fn(f);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();};
  if(fs[0].acc!=null) line(f=>[X(f.step),YA(f.acc)],'#8fa8e6');
  line(f=>[X(f.step),YL(f.loss)],'#e8903a');
  const f=frames[cur]; if(f&&isFinite(f.loss)){
    ctx.strokeStyle='rgba(239,230,218,.35)';ctx.beginPath();ctx.moveTo(X(f.step),pad);ctx.lineTo(X(f.step),H-pad);ctx.stroke();
    ctx.fillStyle='#efe6da';ctx.beginPath();ctx.arc(X(f.step),YL(f.loss),4,0,6.283);ctx.fill();
  }
}

function show(i){
  if(!frames.length||!meta.layers) return;
  cur=Math.max(0,Math.min(i,frames.length-1)); const f=frames[cur];
  $('empty').hidden=true; $('live').hidden=false;
  $('arch').textContent=meta.summary;
  $('sub').textContent=`${meta.params.toLocaleString()} parameters, ${meta.n.toLocaleString()} data points.`;
  $('r-step').textContent=f.step;
  $('r-loss').textContent=isFinite(f.loss)?f.loss.toFixed(3):'NaN';
  $('acc-box').hidden=f.acc==null;
  if(f.acc!=null) $('r-acc').textContent=(f.acc*100).toFixed(1)+'%';
  const s=$('scrub'); s.max=frames.length-1; s.value=cur;
  drawMap(f); drawNet(f); drawLoss();
}

function setStatus(kind,text){const s=$('status');s.className='status '+kind;s.querySelector('b').textContent=text;}

async function poll(){
  try{
    const after=frames.length?frames[frames.length-1].step:-1;
    const r=await fetch(`/state?after=${after}&run=${run||''}`,{cache:'no-store'});
    const d=await r.json();
    if(d.run!==run){run=d.run;frames=[];cur=-1;following=true;stopPlay();}
    meta=d.meta; finished=d.done;
    if(d.frames.length){frames.push(...d.frames); if(following) show(frames.length-1); else $('scrub').max=frames.length-1;}
    else if(frames.length&&cur<0) show(0);
    setStatus(finished?'done':'live', finished?'Run finished':'Training');
  }catch(e){
    setStatus('', frames.length?'Run ended. Waiting for the next run':'Waiting for a run');
  }
  setTimeout(poll,300);
}

function stopPlay(){if(timer){clearInterval(timer);timer=null;}$('play').textContent='Replay';}
$('play').onclick=()=>{
  if(timer){stopPlay();return;}
  following=false; let i=0; show(0); $('play').textContent='Pause';
  timer=setInterval(()=>{i++; if(i>=frames.length){stopPlay();following=true;show(frames.length-1);return;} show(i);},40);
};
$('scrub').oninput=e=>{stopPlay();const i=+e.target.value;following=i>=frames.length-1;show(i);};
window.addEventListener('resize',()=>{if(cur>=0)show(cur);});
poll();
</script>
</body>
</html>
